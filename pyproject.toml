[project]
name = "fragforce-org"
version = "3.0.0"
requires-python = "==3.13.*"
dependencies = [
    "celery>=5.5",
    "dj-database-url>=3.0",
    "django>=6.1",
    "django-memoize",
    "django-redis>=7.0.0",
    "gunicorn",
    "hiredis",
    "markdown",
    "nh3",
    "psycopg2-binary",
    "py-cord>=2.8.1,<3",
    "redis>=8.1.0",
    "requests[security]",
    "social-auth-app-django>=6.0.1",
    "whitenoise",
]

[project.optional-dependencies]
ci = [
    "coverage",
    "unittest-xml-reporting",
]
dev = [
    "coverage>7.15.4",
    "ruff>=0.16.2",
    "unittest-xml-reporting",
]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude =  ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "fforg.settings"
python_files = ["test_*.py"]
testpaths = ["*/tests", "tests"]