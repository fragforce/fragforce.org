version: 2
updates:
- package-ecosystem: uv
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  cooldown:
    default-days: 3
    semver-major-days: 30
    semver-minor-days: 7
    semver-patch-days: 3
  groups:
    all-patch:
      applies-to: "version-updates"
      update-types:
        - "patch"
    dev-minor:
      applies-to: "version-updates"
      dependency-type: "development"
      update-types:
        - "minor"
