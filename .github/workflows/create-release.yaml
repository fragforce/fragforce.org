name: Create Release

on:
  push:
    branches:
      - master

jobs:
  release:
    name: Create GitHub release and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          client-id: ${{ secrets.FRAGFORCE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.FRAGFORCE_AUTOMATION_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-tags: true

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: tag-check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping release"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG does not exist, creating release"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if CHANGELOG.md is non-empty
        id: changelog-file-check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ ! -s CHANGELOG.md ]; then
            echo "CHANGELOG.md is missing or empty, skipping release" >> "$GITHUB_STEP_SUMMARY"
            echo "has-changelog=false" >> "$GITHUB_OUTPUT"
          else
            echo "### Release Notes for $VERSION" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "CHANGELOG.md exists, extracting section for $VERSION" >> "$GITHUB_STEP_SUMMARY"
            echo "has-changelog=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog
        if: steps.tag-check.outputs.exists == 'false' && steps.changelog-file-check.outputs.has_changelog == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > changelog.txt

          echo "### Release Notes for $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat changelog.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Check if extracted section is non-empty
        id: changelog-section-check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ ! -s changelog.txt ]; then
            echo "CHANGELOG.md section for $VERSION is empty, skipping release" >> "$GITHUB_STEP_SUMMARY"
            echo "has-section=false" >> "$GITHUB_OUTPUT"
          else
            echo "Section for $VERSION extracted successfully" >> "$GITHUB_STEP_SUMMARY"
            echo "has-section=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.tag-check.outputs.exists == 'false' && steps.changelog-file-check.outputs.has_changelog == 'true' && steps.changelog-section-check.outputs.has_section == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh release create "$TAG" \
            --title "Release $VERSION" \
            --notes-file changelog.txt \
            --target "$COMMIT_SHA"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Created release $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip summary
        if: steps.tag-check.outputs.exists == 'true' || steps.changelog-file-check.outputs.has_changelog == 'false' || steps.changelog-section-check.outputs.has_section == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "### Release Skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag $TAG already exists, or CHANGELOG.md is missing/empty, or section for $VERSION is empty" >> "$GITHUB_STEP_SUMMARY"
