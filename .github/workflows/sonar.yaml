name: SonarCloud Analysis

on:
  workflow_run:
    workflows: ["Coverage"]
    types:
      - completed

jobs:
  sonar:
    name: SonarCloud scan
    if: github.repository == 'fragforce/fragforce.org' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      # SECURITY NOTE: allow-unsafe-pr-checkout is required because this workflow
      # uses `workflow_run` to trigger after the Coverage workflow completes.
      # In actions/checkout@v7+, fork PR checkouts are blocked by default for
      # `workflow_run` triggers (see: https://github.com/actions/checkout/releases/tag/v7.0.0).
      #
      # Why we need it:
      # - We must checkout the actual PR code to run SonarCloud analysis on pull requests
      # - Without this flag, the workflow would fail when analyzing forks' PRs
      #
      # Mitigating factors for our use case:
      # 1. This workflow only runs on `github.repository == 'fragforce/fragforce.org'`
      #    - It will NOT run on fork repositories, so the "pwn request" attack vector doesn't apply
      # 2. The checkout happens in a trusted context (official GitHub Actions runner)
      # 3. We're not using `pull_request_target` (more dangerous) but `workflow_run`
      # 4. Coverage data is downloaded from GitHub's artifact system, not user input
      # 5. SonarCloud analysis is read-only - it scans code, doesn't execute or modify it
      #
      # See: https://github.com/actions/checkout/security/advisories/GHSA-wr3m-4mph-g9w6

      - name: Checkout PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.FRAGFORCE_CI_APP_ID }}
          private-key: ${{ secrets.FRAGFORCE_CI_PRIVATE_KEY }}

      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Set scan properties
        run: |
          # Read artifact files and sanitize values before writing to GITHUB_ENV
          # Strip any newlines or control characters to prevent env var injection
          PR_NUMBER=$(tr -dc '0-9' < pr_number.txt)
          PR_BASE=$(tr -dc 'A-Za-z0-9/_.-' < pr_base_ref.txt)
          BRANCH=$(tr -dc 'A-Za-z0-9/_.-' < branch_name.txt)
          echo "SONAR_PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
          echo "SONAR_PR_BASE=$PR_BASE" >> "$GITHUB_ENV"
          echo "SONAR_BRANCH_NAME=$BRANCH" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: SonarCloud Scan (push)
        if: github.event.workflow_run.event != 'pull_request'
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCANNER_OPTS: -Dsonar.branch.name=${{ env.SONAR_BRANCH_NAME }}

      - name: SonarCloud Scan (pull request)
        id: sonar-scan
        if: github.event.workflow_run.event == 'pull_request'
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PR_KEY: ${{ env.SONAR_PR_NUMBER }}
          SONAR_PR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SONAR_PR_BASE: ${{ env.SONAR_PR_BASE }}
          SONAR_SCANNER_OPTS: >-
            -Dsonar.pullrequest.key=${{ env.SONAR_PR_NUMBER }}
            -Dsonar.pullrequest.branch=${{ github.event.workflow_run.head_branch }}
            -Dsonar.pullrequest.base=${{ env.SONAR_PR_BASE }}

      - name: Create SonarCloud quality gate check run
        if: github.event.workflow_run.event == 'pull_request' && always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SCAN_CONCLUSION: ${{ steps.sonar-scan.conclusion }}
          PR_NUMBER: ${{ env.SONAR_PR_NUMBER }}
        run: |
          if [ "$SCAN_CONCLUSION" = "success" ]; then
            CONCLUSION="success"
            TITLE="Quality Gate passed"
          else
            CONCLUSION="failure"
            TITLE="Quality Gate failed"
          fi
          gh api repos/${{ github.repository }}/check-runs \
            --method POST \
            -f name="SonarCloud Quality Gate" \
            -f head_sha="$HEAD_SHA" \
            -f status="completed" \
            -f conclusion="$CONCLUSION" \
            -f "output[title]=$TITLE" \
            -f "output[summary]=See [SonarCloud dashboard](https://sonarcloud.io/dashboard?id=fragforce_fragforce.org&pullRequest=$PR_NUMBER) for details."
