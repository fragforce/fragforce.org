name: Coverage

on:
  push:
    branches:
      - dev
      - master
  pull_request:

jobs:
  coverage:
    name: Run tests with coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_DB: fragforce_test
          POSTGRES_PASSWORD: insecure
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --frozen --no-build --no-binary-package django-memoize --extra ci

      # Linting will come after the migration to uv is complete, disabled for now
      #- name: Lint with ruff
      #  run: uv run --frozen ruff check .

      - name: Django system check
        env:
          DATABASE_URL: postgres://postgres:insecure@localhost/fragforce_test
          SECRET_KEY: insecure-test-key-not-used-in-production
        run: uv run --no-sync --no-build python manage.py check

      - name: Run tests with coverage
        continue-on-error: true
        env:
          DOCKER: "True"
          DATABASE_URL: postgres://postgres:insecure@localhost/fragforce_test
          REDIS_URL: redis://localhost
          SECRET_KEY: insecure-test-key-not-used-in-production
          DJANGO_LOG_LEVEL: WARNING
        run: |
          uv run --no-sync --no-build coverage run manage.py test --testrunner=xmlrunner.extra.djangotestrunner.XMLTestRunner
          uv run --no-sync --no-build coverage xml

      - name: Save PR metadata
        run: |
          echo "${{ github.event_name == 'pull_request' && github.event.number || '' }}" > pr_number.txt
          echo "${{ github.sha }}" > pr_sha.txt
          echo "${{ github.base_ref }}" > pr_base_ref.txt
          echo "${{ github.ref_name }}" > branch_name.txt

      - name: Upload coverage and test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            TEST-*.xml
            pr_number.txt
            pr_sha.txt
            pr_base_ref.txt
            branch_name.txt
          retention-days: 1
