services:
  web:
    build: .
    volumes:
      - .:/code
    env_file: .env
    command: uv run --no-sync --no-build python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      TZ: "Etc/UTC"
      DOCKER: "True"
      DJANGO_LOG_LEVEL: "DEBUG"
      REDIS_URL: "redis://redis"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully
  db:
    image: postgres:18.3
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: "Etc/UTC"
      POSTGRES_HOST_AUTH_METHOD: "trust"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis
    environment:
      TZ: "Etc/UTC"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  init:
    build: .
    volumes:
      - .:/code
    command: bash -c 'uv run --no-sync --no-build python manage.py collectstatic --no-input && uv run --no-sync --no-build python manage.py migrate'
    env_file: .env
    environment:
      TZ: "Etc/UTC"
      DOCKER: "True"
      DJANGO_LOG_LEVEL: "DEBUG"
      REDIS_URL: "redis://redis"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  compile:
    build: .
    volumes:
      - .:/code
    command: bash
networks:
  fragforceorg_default:
    name: "fragforceorg_default"
    driver: bridge
